[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siase"
version = "0.1.0"
description = "SIASE implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "torch>=2.4,<3", "scikit-learn>=1.4,<2", "opencv-python>=4.8,<5", "lpips>=0.1.4,<0.2"]

[project.scripts]
siase-report = "siase.common:report"
siase = "siase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
